# =============================================================================
# SentinelPulse — Docker Compose (task 39.2)
#
# Services:
#   Infrastructure:
#     postgres    — pgvector-enabled PostgreSQL 16
#     redis       — Redis 7 (BullMQ + cache)
#     scrapling   — Python Scrapling service for JS-rendered pages
#
#   Application:
#     api         — Fastify REST API (src/app.ts)
#     scheduler   — Ingestion scheduler / coordinator
#
#   Workers (8 BullMQ workers, one per pipeline stage):
#     worker-normalize
#     worker-dedup
#     worker-entity
#     worker-event
#     worker-sentiment
#     worker-impact
#     worker-feature
#     worker-embed
#
#   Cron jobs (periodic background tasks):
#     cron-velocity   — News velocity / momentum recalculation
#     cron-breadth    — Market breadth recalculation
#     cron-regime     — Market regime classification
# =============================================================================

version: '3.9'

# ---------------------------------------------------------------------------
# Shared environment block (anchored for DRY reuse across services)
# ---------------------------------------------------------------------------
x-common-env: &common-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:-postgresql://sentinel:sentinel_password@postgres:5432/sentinel_pulse}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  SENTINEL_API_KEY: ${SENTINEL_API_KEY}
  DATA_SERVICE_URL: ${DATA_SERVICE_URL}
  DATA_SERVICE_API_KEY: ${DATA_SERVICE_API_KEY}
  SCRAPLING_URL: http://scrapling:8001
  FEATURE_VERSION: ${FEATURE_VERSION:-1.0.0}
  PIPELINE_VERSION: ${PIPELINE_VERSION:-1.0.0}
  # Source toggles
  NEWS_SOURCE_REUTERS_ENABLED: ${NEWS_SOURCE_REUTERS_ENABLED:-true}
  NEWS_SOURCE_MONEYCONTROL_ENABLED: ${NEWS_SOURCE_MONEYCONTROL_ENABLED:-true}
  NEWS_SOURCE_ECONOMICTIMES_ENABLED: ${NEWS_SOURCE_ECONOMICTIMES_ENABLED:-true}
  NEWS_SOURCE_BLOOMBERG_ENABLED: ${NEWS_SOURCE_BLOOMBERG_ENABLED:-false}
  NEWS_SOURCE_FINANCIALTIMES_ENABLED: ${NEWS_SOURCE_FINANCIALTIMES_ENABLED:-false}
  NEWS_SOURCE_COINDESK_ENABLED: ${NEWS_SOURCE_COINDESK_ENABLED:-false}
  # Per-source config
  NEWS_SOURCE_REUTERS_BASE_URL: ${NEWS_SOURCE_REUTERS_BASE_URL:-https://feeds.reuters.com/reuters}
  NEWS_SOURCE_REUTERS_POLL_INTERVAL_MS: ${NEWS_SOURCE_REUTERS_POLL_INTERVAL_MS:-60000}
  NEWS_SOURCE_MONEYCONTROL_BASE_URL: ${NEWS_SOURCE_MONEYCONTROL_BASE_URL:-https://www.moneycontrol.com}
  NEWS_SOURCE_MONEYCONTROL_POLL_INTERVAL_MS: ${NEWS_SOURCE_MONEYCONTROL_POLL_INTERVAL_MS:-60000}
  NEWS_SOURCE_ECONOMICTIMES_BASE_URL: ${NEWS_SOURCE_ECONOMICTIMES_BASE_URL:-https://economictimes.indiatimes.com}
  NEWS_SOURCE_ECONOMICTIMES_POLL_INTERVAL_MS: ${NEWS_SOURCE_ECONOMICTIMES_POLL_INTERVAL_MS:-60000}
  NEWS_SOURCE_BLOOMBERG_BASE_URL: ${NEWS_SOURCE_BLOOMBERG_BASE_URL:-https://www.bloomberg.com}
  NEWS_SOURCE_BLOOMBERG_API_KEY: ${NEWS_SOURCE_BLOOMBERG_API_KEY:-}
  NEWS_SOURCE_FINANCIALTIMES_BASE_URL: ${NEWS_SOURCE_FINANCIALTIMES_BASE_URL:-https://www.ft.com}
  NEWS_SOURCE_FINANCIALTIMES_API_KEY: ${NEWS_SOURCE_FINANCIALTIMES_API_KEY:-}
  NEWS_SOURCE_COINDESK_BASE_URL: ${NEWS_SOURCE_COINDESK_BASE_URL:-https://www.coindesk.com/arc/outboundfeeds/rss/}
  # Circuit breaker + retry
  CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
  CB_RECOVERY_TIMEOUT_MS: ${CB_RECOVERY_TIMEOUT_MS:-60000}
  RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-1000}
  RETRY_MULTIPLIER: ${RETRY_MULTIPLIER:-2}
  RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
  # Worker concurrency
  WORKER_NORMALIZE_CONCURRENCY: ${WORKER_NORMALIZE_CONCURRENCY:-4}
  WORKER_DEDUP_CONCURRENCY: ${WORKER_DEDUP_CONCURRENCY:-2}
  WORKER_ENTITY_CONCURRENCY: ${WORKER_ENTITY_CONCURRENCY:-4}
  WORKER_EVENT_CONCURRENCY: ${WORKER_EVENT_CONCURRENCY:-4}
  WORKER_SENTIMENT_CONCURRENCY: ${WORKER_SENTIMENT_CONCURRENCY:-4}
  WORKER_IMPACT_CONCURRENCY: ${WORKER_IMPACT_CONCURRENCY:-2}
  WORKER_FEATURE_CONCURRENCY: ${WORKER_FEATURE_CONCURRENCY:-4}
  WORKER_EMBED_CONCURRENCY: ${WORKER_EMBED_CONCURRENCY:-2}
  # Embedding
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  # SSRF allowlist
  ALLOWED_SOURCE_DOMAINS: ${ALLOWED_SOURCE_DOMAINS:-feeds.reuters.com,moneycontrol.com,economictimes.indiatimes.com,bloomberg.com,ft.com,coindesk.com}
  # Backfill
  BACKFILL_MAX_CONCURRENCY: ${BACKFILL_MAX_CONCURRENCY:-2}
  BACKFILL_MAX_LIVE_QUEUE_SHARE: ${BACKFILL_MAX_LIVE_QUEUE_SHARE:-0.20}

# ---------------------------------------------------------------------------
# Restart policy anchor
# ---------------------------------------------------------------------------
x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart-policy
    environment:
      POSTGRES_DB: sentinel_pulse
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_pulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    <<: *restart-policy
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scrapling:
    build:
      context: ..
      dockerfile: docker/Dockerfile.scrapling
    <<: *restart-policy
    environment:
      PORT: "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Application ────────────────────────────────────────────────────────────

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ["node", "dist/app.js"]

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/engines/ingestion/Scheduler.js"]

  # ── Workers ────────────────────────────────────────────────────────────────

  worker-normalize:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/workers/normalize.worker.js"]

  worker-dedup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/workers/dedup.worker.js"]

  worker-entity:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/workers/entity.worker.js"]

  worker-event:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/workers/event.worker.js"]

  worker-sentiment:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/workers/sentiment.worker.js"]

  worker-impact:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/workers/impact.worker.js"]

  worker-feature:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/workers/feature.worker.js"]

  worker-embed:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/workers/embed.worker.js"]

  # ── Cron jobs ──────────────────────────────────────────────────────────────

  cron-velocity:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/engines/velocity/velocity-cron.js"]

  cron-breadth:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/engines/breadth/breadth-cron.js"]

  cron-regime:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    <<: *restart-policy
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/engines/market-regime/regime-cron.js"]

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
